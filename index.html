<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Lens</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:white;
}

header{
  padding:20px;
  border-bottom:1px solid #333;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:27px;
  font-weight:bold;
}

.logo span{
  color:#58d68d;
}

select,input,textarea,button{
  padding:13px;
  border-radius:8px;
  border:1px solid #444;
}

select{
  background:#171717;
  color:white;
}

.container{
  width:92%;
  max-width:950px;
  margin:30px auto;
}

.hero{
  text-align:center;
  margin-bottom:30px;
}

.hero h1{
  font-size:38px;
  margin-bottom:12px;
}

.hero span{
  color:#58d68d;
}

.hero p{
  color:#bbb;
  line-height:1.6;
}

.card{
  background:#101010;
  border:1px solid #292929;
  border-radius:15px;
  padding:22px;
  margin-bottom:22px;
}

.tabs{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.tab{
  background:#191919;
  color:white;
  cursor:pointer;
}

.tab.active{
  background:#58d68d;
  color:black;
}

textarea,input[type="url"]{
  width:100%;
  background:#080808;
  color:white;
}

textarea{
  height:170px;
  resize:vertical;
}

.upload{
  border:2px dashed #444;
  padding:30px;
  text-align:center;
  border-radius:12px;
  color:#aaa;
}

.analyze{
  width:100%;
  margin-top:18px;
  background:#58d68d;
  color:black;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.hidden{
  display:none;
}

#results{
  display:none;
}

.scoreBox{
  text-align:center;
  background:#080808;
  padding:25px;
  border-radius:12px;
}

.score{
  font-size:52px;
  font-weight:bold;
  color:#ff4040;
}

.risk{
  display:inline-block;
  margin-top:10px;
  padding:8px 15px;
  border-radius:20px;
  background:#351010;
  color:#ff4040;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:13px 8px;
  border-bottom:1px solid #292929;
  text-align:left;
}

.badge{
  padding:6px 10px;
  border-radius:15px;
  font-size:13px;
  font-weight:bold;
}

.high{
  background:#351010;
  color:#ff4040;
}

.medium{
  background:#352b08;
  color:#ffad00;
}

.low{
  background:#123317;
  color:#65dc57;
}

.nutrition{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.nutrition div{
  background:#181818;
  padding:16px 8px;
  text-align:center;
  border-radius:10px;
}

.explanation{
  background:#101b14;
  border-left:4px solid #58d68d;
  padding:18px;
  line-height:1.7;
}

.warning{
  background:#211b0a;
  border-left:4px solid #ffad00;
  padding:18px;
  line-height:1.7;
  margin-top:15px;
}

.footer{
  text-align:center;
  color:#777;
  padding:30px;
}

@media(max-width:650px){
  .hero h1{
    font-size:30px;
  }

  .nutrition{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🔐 Privacy <span>Lens</span></div>

<select class="language" onchange="changeLanguage(this.value)">
<option value="en">English</option>
<option value="te">తెలుగు</option>
<option value="hi">हिन्दी</option>
</select>


</header>

<div class="container">

  <div class="hero">
<h1>
<span id="privacyPolicyTitle">Privacy Policy Analyzer</span>
</h1>
    <p id="heroText">
      Understand what apps and websites do with your personal data.
    </p>
  </div>


  <!-- INPUT SECTION -->

  <div class="card">

<h2 id="privacyPolicyHeading">Privacy Policy</h2>
    <div class="tabs">

      <button class="tab active"
        onclick="showTab('text',this)">
      <span id="pasteTab">📝 Paste Text</span>
      </button>

      <button class="tab"
        onclick="showTab('pdf',this)">
       <span id="pdfTab">📄 Upload PDF</span>
      </button>

      <button class="tab"
        onclick="showTab('url',this)">
        <span id="urlTab">🔗 Website URL</span>
      </button>

    </div>


    <div id="text">

      <textarea id="policyText"
        placeholder="మీ ప్రైవసీ పాలసీని ఇక్కడ పేస్ట్ చేయండి..."

    </div>


    <div id="pdf" class="hidden">

      <div class="upload">

        <h3>📄 Upload Privacy Policy PDF</h3>

        <p>Select a PDF from your device.</p>

        <input type="file"
          id="pdfFile"
          accept=".pdf">

      </div>

    </div>


    <div id="url" class="hidden">

      <input type="url"
        id="websiteURL"
        placeholder="https://example.com/privacy">

    </div>


    <button class="analyze" onclick="analyzePolicy()">
      <span id="analyzeBtnText">🔍 Analyze Privacy Policy</span>
    </button>

  </div>


  <!-- RESULT SECTION -->

  <div id="results">

    <div class="card">

      <h2>📊 Privacy Risk Score</h2>

      <div class="scoreBox">

        <div class="score">72/100</div>

        <div class="risk">
          🔴 HIGH RISK
        </div>

        <p style="margin-top:12px;color:#aaa;">
          Higher score means higher privacy concern.
        </p>

      </div>

    </div>


    <!-- AI ANALYSIS -->

    <div class="card">

      <h2>🤖 AI Analysis</h2>

      <table>

        <tr>
          <th>Category</th>
          <th>Result</th>
        </tr>

        <tr>
          <td>Personal Data</td>
          <td><span class="badge high">🔴 High</span></td>
        </tr>

        <tr>
          <td>Location</td>
          <td><span class="badge medium">🟠 Medium</span></td>
        </tr>

        <tr>
          <td>Contacts</td>
          <td><span class="badge low">🟢 Low</span></td>
        </tr>

        <tr>
          <td>Camera</td>
          <td><span class="badge low">🟢 Low</span></td>
        </tr>

        <tr>
          <td>Microphone</td>
          <td><span class="badge medium">🟠 Medium</span></td>
        </tr>

        <tr>
          <td>Device Information</td>
          <td><span class="badge high">🔴 High</span></td>
        </tr>

        <tr>
          <td>Browsing History</td>
          <td><span class="badge medium">🟠 Medium</span></td>
        </tr>

        <tr>
          <td>Cookies</td>
          <td><span class="badge medium">🟠 Medium</span></td>
        </tr>

        <tr>
          <td>Advertising</td>
          <td><span class="badge high">🔴 High</span></td>
        </tr>

        <tr>
          <td>Third-party Sharing</td>
          <td><span class="badge high">🔴 High</span></td>
        </tr>

        <tr>
          <td>Data Retention</td>
          <td><span class="badge medium">🟠 Medium</span></td>
        </tr>

        <tr>
          <td>Data Deletion</td>
          <td><span class="badge low">🟢 Low</span></td>
        </tr>

        <tr>
          <td>Security</td>
          <td><span class="badge low">🟢 Good</span></td>
        </tr>

      </table>

    </div>


    <!-- NUTRITION LABEL -->

    <div class="card">

      <h2>🏷️ Privacy Nutrition Label</h2>

      <div class="nutrition">

        <div>
          <b>👤</b>
          Personal Data
          <br><br>
          <span class="badge high">High</span>
        </div>

        <div>
          <b>📍</b>
          Location
          <br><br>
          <span class="badge medium">Medium</span>
        </div>

        <div>
          <b>📢</b>
          Advertising
          <br><br>
          <span class="badge high">High</span>
        </div>

        <div>
          <b>🔗</b>
          Third Parties
          <br><br>
          <span class="badge high">High</span>
        </div>

      </div>

    </div>


    <!-- SIMPLE EXPLANATION -->

    <div class="card">

      <h2>💡 Simple Explanation</h2>

      <div class="explanation">

        <b>What does this mean?</b>

        <p>
          This policy may collect several types of personal
          information. Some information may be used for
          advertising or shared with third parties.
        </p>

      </div>

      <div class="warning">

        ⚠️ <b>Privacy Tip</b>

        <p>
          Check whether the permissions and data collection
          are really necessary before using the service.
        </p>

      </div>

    </div>

  </div>

</div>


<div class="footer">
  🔐 Privacy Lens — Privacy made simple
</div>


<script>

function showTab(tabName,button){

  document.getElementById("text")
    .classList.add("hidden");

  document.getElementById("pdf")
    .classList.add("hidden");

  document.getElementById("url")
    .classList.add("hidden");

  document.getElementById(tabName)
    .classList.remove("hidden");

  document.querySelectorAll(".tab")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");
}


function analyzePolicy(){

  const results =
    document.getElementById("results");

  results.style.display = "block";

  results.scrollIntoView({
    behavior:"smooth"
  });

}

function changeLanguage(language){

  const text = document.getElementById("heroText");
  const pasteTab = document.getElementById("pasteTab");
  const pdfTab = document.getElementById("pdfTab");
  const urlTab = document.getElementById("urlTab");
  const analyzeBtnText = document.getElementById("analyzeBtnText");
  const privacyPolicyTitle = document.getElementById("privacyPolicyTitle");
const privacyPolicyHeading = document.getElementById("privacyPolicyHeading");
  if(language === "te"){

    text.innerText =
    "యాప్స్ మరియు వెబ్‌సైట్లు మీ పర్సనల్ డేటాతో ఏమి చేస్తున్నాయో సులభంగా తెలుసుకోండి.";
if(privacyPolicyHeading)
  privacyPolicyHeading.innerText = "ప్రైవసీ పాలసీ";
    if(privacyPolicyTitle)
      privacyPolicyTitle.innerText = "ప్రైవసీ పాలసీ అనలైజర్";

    pasteTab.innerText = "📝 టెక్స్ట్ పేస్ట్ చేయండి";
    pdfTab.innerText = "📄 PDF అప్‌లోడ్ చేయండి";
    urlTab.innerText = "🔗 వెబ్‌సైట్ URL";
    analyzeBtnText.innerText = "🔍 ప్రైవసీ పాలసీని అనలైజ్ చేయండి";

  }else{

    text.innerText =
    "Understand what apps and websites do with your personal data.";

    if(privacyPolicyTitle)
      privacyPolicyTitle.innerText = "Privacy Policy Analyzer";

    pasteTab.innerText = "📝 Paste Text";
    pdfTab.innerText = "📄 Upload PDF";
    urlTab.innerText = "🔗 Website URL";
    analyzeBtnText.innerText = "🔍 Analyze Privacy Policy";

  }

}
</script>

</body>
</html>
